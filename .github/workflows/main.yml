name: .NET Core CI/CD # Name of the workflow

on:
  push:
    branches: [ main ] # Triggers on pushes to the main branch
  pull_request:
    branches: [ main ] # Triggers on pull requests to the main branch

jobs:
  build:
    runs-on: ubuntu-latest # Specifies the runner environment

    steps:
    - uses: [actions/checkout@v4](https://github.com) # Step to check out your repository code
    - name: Setup .NET
      uses: [actions/setup-dotnet@v4](https://github.com/actions/setup-dotnet) # Action to set up the .NET environment
      with:
        dotnet-version: '8.0.x' # Specify the desired .NET SDK version

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --no-restore

    - name: Run tests
      run: dotnet test --no-build

    # Add deployment steps here as additional jobs or steps, e.g., to Azure App Service, AWS, or Docker Hub.
